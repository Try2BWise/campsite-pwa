<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Favicon & PWA Icons -->
  <link rel="icon" type="image/png" sizes="128x128" href="campervan.png">
  <link rel="apple-touch-icon" href="campervan.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  
  <link rel="manifest" href="manifest.json">
  <title>Campsite Checker PWA</title>
</head>
<body>
  <h2>Campsite Availability Checker</h2>
  
  <label for="campground">Select Location:</label>
  <select id="campground">
    <option value="232721">Toad Suck Park (232721)</option>
    <option value="233098">Maumelle COE (233098)</option>
  </select>

  <br/><br/>
  <label for="targetSites">Target Sites (comma separated, blank = all):</label><br/>
  <input type="text" id="targetSites" placeholder="e.g. B3, B4, C1, C10" value="B3, B4, C1, C10">

  <br/><br/>
  <button id="checkBtn">Check Availability</button>

  <div id="results"></div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
  </script>
</body>
</html>
